# Reference linter map. `compare.jl` checks every rule of ReLint and LintApp against this file.
# Entry: reference `rule`, optional `message` regex, and one of:
#   corset = "<rule>": each report needs Corset finding of that rule on same line.
#   allow = "<reason>": report needs no Corset finding.
# Report takes first entry whose rule and message match. Report with no entry fails.
# `disagree`: reference false positive that Corset rejects on purpose, keyed by file, rule and trimmed line text.
# Entry no report uses fails, so stale entries cannot linger.

# ReLint

[[relint]]
rule = "@async"
corset = "pinned-task"

[[relint]]
rule = "static threads"
corset = "pinned-task"

[[relint]]
rule = "array with no specific type"
corset = "untyped-empty"

[[relint]]
rule = "initializing with `nthreads`"
corset = "baked-state"

[[relint]]
rule = "mutating ENV"
corset = "process-state"

[[relint]]
rule = "unreachable branch"
corset = "unreachable"

[[relint]]
rule = "unlock"
allow = "flags every `unlock`; `unguarded-release` reports throw while lock is held outside `try` only"

[[relint]]
rule = "return type annotation"
allow = "opposes `annotation` (F71), which asks for result types; `result-conversion` (F13) reports converting ones"

[[relint]]
rule = "no import"
allow = "house style; Corset asks for explicit imports (F65)"

[[relint]]
rule = "@inbounds"
allow = "later stage: `unverified-inbounds` (inference) reports unproven sites only"

[[relint]]
rule = "bare using"
allow = "later stage: `implicit-import` (external)"

[[relint]]
rule = "closure capture by reference"
allow = "later stage: `boxed-capture` (scope) reports rebound captures only"

[[relint]]
rule = "non-const untyped global"
allow = "later stage: `hidden-input` (effects)"

[[relint]]
rule = "splatting"
allow = "later stage: `dynamic-splat` (inference) reports variable-length collections only"

[[relint]]
rule = "uv"
allow = "later stage: `internal-access` (external)"

[[relint]]
rule = "not fully parametrised constructor"
allow = "project heuristic; real cost shows as `runtime-dispatch` (F27, inference)"

[[relint]]
rule = "@generated"
allow = "caution marker; project ban list (`banned`) expresses it"

[[relint]]
rule = "Task"
allow = "caution marker; project ban list (`banned`) expresses it"

[[relint]]
rule = "show"
allow = "caution marker; project ban list (`banned`) expresses it"

[[relint]]
rule = "ccall"
allow = "caution marker; project ban list (`banned`) expresses it"

[[relint]]
rule = "finalizer"
allow = "caution marker; project ban list (`banned`) expresses it"

[[relint]]
rule = "@cfunction"
allow = "caution marker; project ban list (`banned`) expresses it"

[[relint]]
rule = "yield"
allow = "caution marker; project ban list (`banned`) expresses it"

[[relint]]
rule = "sleep"
allow = "caution marker; project ban list (`banned`) expresses it"

[[relint]]
rule = "@sync"
allow = "caution marker; project ban list (`banned`) expresses it"

[[relint]]
rule = "@threads"
allow = "caution marker; data races belong to scope stage (F69)"

[[relint]]
rule = "ErrorException"
allow = "style: custom exception types"

[[relint]]
rule = "error"
allow = "style; `error` fails loud"

[[relint]]
rule = "return in anonymous function"
allow = "style: trailing `return` is harmless"

[[relint]]
rule = "string interpolation"
allow = "style"

[[relint]]
rule = "string concatenation"
allow = "style"

[[relint]]
