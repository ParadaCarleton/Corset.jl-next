# Disagreements

[[disagree]]
tool = "relint"
file = "test/ui/unreachable/negative.jl"
rule = "unreachable branch"
code = "if pop!(queue) == 1"
reason = "`pop!` changes queue, so second condition reads other element"

[[disagree]]
tool = "relint"
file = "test/ui/unreachable/negative.jl"
rule = "unreachable branch"
code = "if state.ready"
reason = "`refresh!` in branch condition between can change `state.ready`"

[[disagree]]
tool = "lintapp"
file = "test/ui/unreachable/negative.jl"
rule = "duplicate_branch_condition"
code = "elseif state.ready"
reason = "`refresh!` in branch condition between can change `state.ready`"

[[disagree]]
tool = "lintapp"
file = "test/ui/nan-compare/negative.jl"
rule = "nan_comparison"
code = "quoted = :(x == NaN)"
reason = "quoted code is data until evaluated; Corset skips quotes outside interpolation"

[[disagree]]
tool = "lintapp"
file = "test/ui/pinned-task/negative.jl"
rule = "async_task"
code = "Mine.@async work()"
reason = "`Mine.@async` is other module's macro; Corset checks Base `@async` only"
