name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Corset - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Inference stage infers waves on every thread; relaunched process keeps this count.
    env:
      JULIA_NUM_THREADS: "4"
    strategy:
      fail-fast: false
      matrix:
        # Corset supports latest Julia release only; prerelease compiler internals differ (`bb_vartables`).
        version: ["1.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # Track `src` only: coverage counters in test fixtures void compiler `effect_free` proofs that rule tests check.
      - run: julia --color=yes --project=. -e 'using Pkg; Pkg.test(; coverage = "@" * joinpath(pwd(), "src"), julia_args = `--check-bounds=yes`)'
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - name: Require 100% line coverage
        if: matrix.version == '1.13'
        run: |
          sudo apt-get install -y lcov
          lcov --summary lcov.info 2>&1 | tee summary.txt
          awk '/^SF:/ {file = substr($0, 4)} /^DA:[0-9]+,0$/ {print "uncovered:", file, substr($0, 4)}' lcov.info
          grep -Eq 'lines\.*: 100\.0%' summary.txt
  legacy:
    name: CorsetLegacy - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The jet rule analyzes frames on every thread; its test compares that with a serial run.
    env:
      JULIA_NUM_THREADS: "4"
    strategy:
      fail-fast: false
      matrix:
        version: ["1.13", "pre"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      # The fatou and jscpd tests run the real tools mise.toml pins, from temp directories mise's shims cannot resolve.
      - uses: jdx/mise-action@v2
      - run: mise bin-paths >> "$GITHUB_PATH"
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: lib/CorsetLegacy
      - uses: julia-actions/julia-runtest@v1
        with:
          project: lib/CorsetLegacy
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: lib/CorsetLegacy/src
      - name: Require 100% line coverage
        if: matrix.version == '1.13'
        run: |
          sudo apt-get install -y lcov
          lcov --summary lcov.info 2>&1 | tee summary.txt
          awk '/^SF:/ {file = substr($0, 4)} /^DA:[0-9]+,0$/ {print "uncovered:", file, substr($0, 4)}' lcov.info
          grep -Eq 'lines\.*: 100\.0%' summary.txt
      # Coverage blocks inlining and constant folding; users run without it.
      - uses: julia-actions/julia-runtest@v1
        if: matrix.version == '1.13'
        with:
          project: lib/CorsetLegacy
          coverage: false
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: fatou lint --color never lib/CorsetLegacy/src lib/CorsetLegacy/test
  corset:
    name: corset (self-lint CorsetLegacy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pedantic fatou and jscpd rules run the tools mise.toml pins.
      - uses: jdx/mise-action@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: lib/CorsetLegacy
      # TestEnv activates the test target's environment, so this step also works in packages that list
      # Corset only as a test dependency.
      - run: julia -e 'using Pkg; Pkg.add("TestEnv")'
      - run: julia --project=. -e 'using TestEnv; TestEnv.activate(); using CorsetLegacy; exit(CorsetLegacy.main(ARGS))' -- check . --pedantic --deny-warnings
        working-directory: lib/CorsetLegacy
  self-lint:
    name: corset (self-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - run: julia --project=. -m Corset check src -D warnings
  reference:
    name: reference linters
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"
      - uses: julia-actions/cache@v2
      - run: julia --project=test -e 'using Pkg; Pkg.instantiate()'
      # Each reference linter runs in its own environment under test/reference; compare.jl instantiates them.
      - run: julia --project=test test/reference/compare.jl
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: fredrikekre/runic-action@v1
        with:
          version: "1"
