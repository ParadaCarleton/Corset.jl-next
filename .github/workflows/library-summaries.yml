name: Build library summaries
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  summaries:
    if: startsWith(github.ref, 'refs/heads/') && github.ref_name != 'main' && github.ref_name != 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"
      - uses: julia-actions/cache@v2
      - name: Require x86_64 Linux
        run: test "$(uname -s)" = Linux && test "$(uname -m)" = x86_64
      - name: Instantiate Corset
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Build artifact
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          url="https://github.com/${REPOSITORY}/releases/download/library-summaries"
          julia --startup-file=no --project=. gen/summaries/build.jl "$url" summary-output
      - name: Upload immutable asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view library-summaries --json isPrerelease --jq .isPrerelease)" = true
          files=(summary-output/library-summaries-*.tar.gz)
          test "${#files[@]}" = 1 && test -f "${files[0]}"
          gh release upload library-summaries "${files[0]}"
      - name: Open binding pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          branch="library-summaries-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name github-actions\[bot\]
          git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
          git switch -c "$branch"
          git add Artifacts.toml
          git commit -m 'Bind library summaries artifact'
          git push origin "$branch"
          gh pr create --base "$BASE_BRANCH" --head "$branch" --title 'Bind library summaries artifact' --body 'Bind the library summaries before creating the release tag.'
