# Generated tables read this file. Run `uv run docs/design/build.py` after edits.

# Analysis stages in pipeline order. Each computes facts once per run; rules read them.

[[stage]]
name = "syntax"
title = "Syntax patterns"
text = "One tree walk per file. Rules are Argus.jl patterns: syntax classes, pattern forms, templates for fixes. Walk indexes rules by pattern root kind and asks Argus to match candidate nodes only. Names read as written: Base export name means Base binding; `shadowed-base` reports package method that breaks this. Macro arguments read as code, except arguments with `{}` (stopgap, revisit later); quoted code reads as data outside `$` interpolation."

[[stage]]
name = "package"
title = "Loaded package"
text = "Loaded package without inference: bindings, structs, signatures, method table, specialization heuristics."

[[stage]]
name = "scope"
title = "Scope"
text = "Lowered scopes per top-level form, in include order, after package load: bindings, soft scope, captures, boxes, task spawns."

[[stage]]
name = "inference"
title = "Typed IR"
text = "One inference per package method; stand-in types replace generic arguments. One pass per inferred frame. Union policy decides which unions `ad-hoc-union` reports."

[[stage]]
name = "effects"
title = "Effect and alias summary"
text = "Per method: writes to arguments, writes to globals, result aliases global state. Own points-to summary over optimized IR, bottom-up through callees, Base and dependencies included."

[[stage]]
name = "lifecycle"
title = "Array lifecycle"
text = "Local def-use per array: created, written, read before write, resized, escapes, read once. Callee writes come from `effects` summaries, so passing array to non-writing callee is no escape. Definite only for straight-line patterns."

[[stage]]
name = "external"
title = "External tools"
text = "Wrap tool output as findings: Aqua.jl, ExplicitImports.jl, jscpd."
