[[footgun]]
id = 22
area = "types"
text = "Equality, `hash` and `isless` break `isequal` contract"
example = "`==` without `hash`; `==` on float fields without `isequal`"
group = "correctness"
stage = "package"
note = "Contract from Base `isequal` and `hash` docs: `isequal(x, y)` implies equal hashes; own `==` or `isequal` needs own `hash`, and type with float values defines `isequal`; `hash` implements 2-argument form; exactly one of `isequal(x, y)`, `isless(x, y)`, `isless(y, x)` holds. `possible` for `hash` without equality on identity-compared type and for `isless` against equality fields."

[[footgun]]
id = 23
area = "types"
text = "Method named like Base function without `Base.` shadows it"
example = "`length(x::MyT) = …`"
group = "correctness"
stage = "package"
note = "Julia 1.13 raises no error: module gets separate function, so `length([1, 2])` there throws `MethodError`. Definite for operators and Base interface functions on package types; possible otherwise, since packages shadow `parse` or `print` on purpose."

[[footgun]]
id = 24
area = "types"
text = "Method definition overwrites earlier one with same positional signature"
example = "`f(x; a)` and `f(x; b)`: keywords take no part in dispatch"
group = "correctness"
stage = "package"
note = "Package precompilation fails, and Julia loads package without cache on each load. Later definition replaces positional method; keyword sorter of earlier one stays when later one has no keywords, so keyword calls run earlier body. Julia keeps replaced method in method table with `dispatch_status` 0; rule pairs it with later method of same signature, so definition that never ran (`if false`) is no finding. Scripts: later, with definitions-only load."

