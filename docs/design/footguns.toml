area = "syntax"
text = "Space before minus in array literal concatenates"
example = "`[1 -2]` is 1×2 matrix"
group = "correctness"
stage = "syntax"
note = "Needs whitespace: rule reads source bytes between elements, since Argus patterns ignore trivia."

