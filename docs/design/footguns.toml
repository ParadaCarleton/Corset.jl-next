[[footgun]]
id = 15
area = "types"
text = "Overspecified type blocks generic callers"
example = "`x::Float64`, `x::AbstractFloat`, `v::AbstractVector{Float64}`, `x::Union{Int16, Int32, Int64}` reject other types"
group = "composability"
stage = "package"
note = "Overspecified: names specific number type, `AbstractFloat`, or concrete container anywhere in annotation. Kind enumerated union: union of sibling number types; fix `typejoin` (`Integer`, floats to `Real`). Union of package variants that leaves out some subtypes is deliberate and passes. Fix: type parameter. Message says annotation gains no speed: Julia compiles for each concrete argument type anyway. Exempt: concrete method beside generic method of same function (fast path)."

