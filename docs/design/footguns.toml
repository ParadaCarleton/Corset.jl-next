[[footgun]]
id = 97
area = "readability"
text = "Literal statement has no effect"
example = "blank line between docstring and function: docs lost"
group = "readability"
stage = "syntax"
note = "Kinds: detached docstring (blank line or comment ends attachment; rustc `unused_doc_comments`), other literal. Last statement of block is its value: exempt. Call without effect: F54."

[[footgun]]
id = 106
area = "syntax"
text = "`&&` on right of `||` binds tighter than reader expects"
example = "`done || empty && return` never returns when `done` holds"
group = "readability"
stage = "syntax"
note = "GCC `-Wparentheses` warns on same shape. `a && b || c` reads as Julia parses it, so it passes."

[[footgun]]
id = 108
area = "types"
text = "`@enum` holds fixed case set, so no check finds unhandled case"
example = "`@enum Tier safe likely` → `@data Tier begin Safe() < Likely() end`"
group = "safety"
stage = "syntax"
note = "Later: needs Moshi release with order chains and `@match` exhaustiveness check. Cases others extend use dispatch on subtypes (F84); fixed cases use Moshi `@data`. Covers `@enum` and EnumX `@enumx`. Exempt: explicit values or base type (`@enum Flag::UInt32 A = 1`) for C interop, bit flags and wire formats. Primary span: definition; cause spans: comparisons with its values. Fix `manual`."

[[footgun]]
id = 109
area = "containers"
text = "`iterate` on `Iterators.Stateful` hides write; `popfirst!` names it"
example = "`x, _ = iterate(s)` → `x = popfirst!(s)`"
group = "readability"
stage = "inference"
note = "Fix `manual`: `popfirst!` throws `EOFError` where `iterate` returns `nothing`; guard with `isempty(s)`."

[[footgun]]
id = 110
area = "numbers"
text = "Naive formula overflows or loses precision where stable function exists"
example = "`log(1 + x)` → `log1p(x)`; `log(sum(exp.(x)))` → `logsumexp(x)`"
group = "correctness"
stage = "inference"
note = "Pattern table on `Number` operands, dotted forms included. Base and LinearAlgebra: `log(1 + x)` → `log1p(x)`; `log(1 - x)` → `log1p(-x)`; `exp(x) - 1` → `expm1(x)`; `sqrt(x^2 + y^2)` → `hypot(x, y)`; `sin(π * x)` → `sinpi(x)`, `cos` likewise; `x^(1/3)` → `cbrt(x)`; `log(x) / log(2)` → `log2(x)`, `10` likewise; `log(det(A))` → `logdet(A)`; `inv(A) * b` → `A \\ b`. LogExpFunctions.jl: `log(sum(exp.(x)))` → `logsumexp(x)`; `log(exp(a) + exp(b))` → `logaddexp(a, b)`; `log(1 + exp(x))` → `log1pexp(x)`; `log(1 - exp(x))` → `log1mexp(x)`; `1 / (1 + exp(-x))` → `logistic(x)`; `exp.(x) ./ sum(exp.(x))` → `softmax(x)`; `x * log(x)` → `xlogx(x)`; `x * log(y)` → `xlogy(x, y)`. Shifted form (`exp.(x .- maximum(x))`) is stable: exempt. Fix `likely` (changes rounding). Fix adds explicit import, and adds LogExpFunctions.jl to `[deps]` and `[compat]` when project lacks it. Clippy `imprecise_flops`."

[[footgun]]
id = 111
area = "arrays"
text = "Resizing call on argument whose annotation admits fixed-size arrays"
example = "`f(v::AbstractVector) = push!(v, 0)` throws on `1:3`, `view(a, 1:2)` and `SVector`"
group = "composability"
stage = "inference"
note = "Calls: `push!`, `pushfirst!`, `append!`, `prepend!`, `insert!`, `pop!`, `popfirst!`, `popat!`, `deleteat!`, `keepat!`, `splice!`, `resize!`, `empty!`, `filter!`, `unique!`. Annotation: Base abstract array type (`AbstractVector`, `DenseVector`, `StridedVector` and others), bound of type parameter, or union member. Type tests before call narrow it. Unannotated argument and package abstract types pass. Definite. Direct call only; resize through callee waits for effect kinds. Fix `manual`: write into caller-allocated output by index (faster than growth); narrow to `Vector`; or return new array."
