# Generated tables read this file. Run `uv run docs/design/build.py` after edits.

# Analysis families: one shared analysis each.

[[family]]
letter = "A"
title = "Syntax patterns"
text = "One tree walk per file. Checks are Argus.jl patterns: syntax classes, pattern forms, templates for fixes. Walk indexes rules by pattern root kind and asks Argus to match candidate nodes only. Names read as written: Base export name means Base binding; `shadowed-base` reports package method that breaks this."

[[family]]
letter = "B"
title = "Array lifecycle"
text = "Local def-use per array: created, written, read before write, resized, escapes, read once. Definite only for straight-line patterns."

[[family]]
letter = "C"
title = "Module inspection"
text = "Loaded package without inference: bindings, structs, signatures, method table, specialization heuristics."

[[family]]
letter = "D"
title = "Typed-IR scan"
text = "One inference per package method; stand-in types replace generic arguments. One pass per inferred frame. Union policy decides which unions `ad-hoc-union` reports."

[[family]]
letter = "E"
title = "Effect and alias summary"
text = "Per method: writes to arguments, writes to globals, result aliases global state. Own points-to summary over optimized IR, bottom-up through callees, Base and dependencies included."

[[family]]
letter = "H"
title = "Scope"
text = "Lowered scopes per top-level form, in include order, after package load: bindings, soft scope, captures, boxes, task spawns."

[[family]]
letter = "G"
title = "External tools"
text = "Wrap tool output as findings: Aqua.jl, ExplicitImports.jl, jscpd."
